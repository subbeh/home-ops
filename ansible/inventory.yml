---
all:
  vars:
    ansible_user: sysadm

# Location groups
remote:
  hosts:
    vps:
      ansible_user: root
      # Its tailnet IP is networks.tailnet.addresses.vps in group_vars/all/network.yaml.
      ansible_host: vps.tailnet-7233.ts.net
      services_domain: vps.sbbh.cloud
      services: [traefik, syncthing, aven, opengym, restic, backrest, gatus, semaphore, atuin, docker-socket-proxy, hermes, searxng, unifi, dufs]

local:
  hosts:
    opnsense:
      # Its tailnet IP is networks.tailnet.addresses.opnsense in group_vars/all/network.yaml. The
      # Cloudflare name, not the ts.net one: the UI rejects hostnames missing from its Alternate
      # Hostnames.
      ansible_host: opnsense.sbbh.cloud
      # Configured through its API from the controller, never over SSH.
      ansible_connection: local
    pve-nuc:
      # Its servers address in group_vars/all/network.yaml.
      ansible_host: "{{ networks.servers.addresses[inventory_hostname] }}"
    pve-nas:
      # Its servers address in group_vars/all/network.yaml.
      ansible_host: "{{ networks.servers.addresses[inventory_hostname] }}"
    nas-svc:
      # The Docker LXC on pve-nas, created by playbooks/pve.yaml. Proxmox templates ship root only.
      ansible_user: root
      ansible_host: "{{ networks.servers.addresses[inventory_hostname] }}"
      services: [whoami, metube, sts, copyparty]
    nuc-svc:
      # The Docker LXC on pve-nuc, created by playbooks/pve.yaml.
      ansible_user: root
      ansible_host: "{{ networks.servers.addresses[inventory_hostname] }}"
      services: [crawl4ai]

# OS groups
debian:
  hosts:
    vps:
    pve-nuc:
    pve-nas:
    nas-svc:
    nuc-svc:

# Functional groups
pve:
  hosts:
    pve-nuc:
    pve-nas:

vm:
  hosts: {}

k8s:
  hosts: {}
  vars:
    cluster_endpoint: ""
    cluster_endpoint_addr: ""
    cluster_cidr: ""
    management_cidr: ""
