---
all:
  vars:
    ansible_user: sysadm

# Location groups
remote:
  hosts:
    vps:
      ansible_user: root
      # Its tailnet IP is networks.tailnet.addresses.vps in group_vars/all/network.yaml.
      ansible_host: vps.tailnet-7233.ts.net
      services_domain: vps.sbbh.cloud
      services: [traefik, syncthing, karakeep, aven, opengym, restic, gatus, semaphore, atuin]

local:
  hosts: {}

# OS groups
debian:
  hosts:
    vps:

# Functional groups
pve:
  children: {}

vm:
  hosts: {}

k8s:
  hosts: {}
  vars:
    cluster_endpoint: ""
    cluster_endpoint_addr: ""
    cluster_cidr: ""
    management_cidr: ""
