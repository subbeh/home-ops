---
# Read by ansible/playbooks/pve.yaml. Names only, never IPs: addresses come from
# group_vars/all/network.yaml.

# The OS device behind each Port in devices.yaml. Port 0 (servers) is vmbr0's, set by the
# installer; port 1 (storage) gets vmbr1 from the playbook, which refuses to run while it's empty.
port_devices:
  "1": nic1

# Exported by the kernel NFS server, straight from ZFS and XFS. Each Network gets the export at
# its CIDR.
nfs_exports:
  - {path: /data/hdd0/pub, networks: [servers, clients]}
  # Not to servers: it holds restic's repositories (restic_sftp below), and no_root_squash would let
  # root on any servers Host change them past the chroot.
  # shortcut: clients keep rw,no_root_squash, so a client device (ST Wi-Fi included) still can,
  # move the chroot outside every export (e.g. /data/hdd0/restic) once clients aren't trusted.
  - {path: /data/hdd0/backups, networks: [clients]}
  - {path: /data/hdd1/media, networks: [storage, servers]}
  - {path: /data/nvme/media, networks: [storage, servers]}
  - {path: /data/nvme/downloads, networks: [storage, servers]}
  # Kubernetes volumes: every client's writes land as uid 1000.
  - path: /data/nvme/k8s
    networks: [storage]
    options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000

# The second restic repository of each Host restic runs on (services/restic.yaml), served over
# SFTP to the restic user, chrooted here. The key is RESTIC_SSH_KEY's public half.
restic_sftp:
  path: /data/hdd0/backups/restic
  authorized_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIPAm/mt6mIco1hSF1NypPI9J9QTAmYKGVLIk6bs1Xvx restic

# The Docker LXC Host, created by roles/pve. vmid is <vlan><host number> of its servers address.
pve_lxc:
  hostname: nas-svc
  vmid: 2030
  cores: 4
  memory: 8192
  # local-lvm is the installer's default thin pool on the SSD (ext4 install).
  disk: local-lvm:20
  # Applied with pct set on every run, so a change reaches the existing container; each must
  # read back the same in `pct config`. mp0's Host directory is created owned by the container's
  # root (uid 100000 on the Host).
  options:
    features: nesting=1
    mp0: /data/nvme/app_data/nas-svc,mp={{ services_data_dir }}
    mp1: /data/hdd1/media,mp=/data/media
    # The iGPU's render node, for hardware video transcoding. Root-owned in the container, which
    # suits root containers; a Service lists it in its container's `devices` too.
    dev0: /dev/dri/renderD128
