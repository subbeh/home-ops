---
karakeep:
  description: Bookmark manager with full-text search and page archiving

  no_log: true

  vars:
    karakeep_url: "https://karakeep.{{ services_domain }}"
    karakeep_meili_master_key: "{{ bws_secrets.KARAKEEP_MEILI_MASTER_KEY }}"
    karakeep_nextauth_secret: "{{ bws_secrets.KARAKEEP_NEXTAUTH_SECRET }}"
    karakeep_openai_api_key: "{{ bws_secrets.KARAKEEP_OPENAI_API_KEY }}"

  files:
    - dest: "{{ services_data_dir }}/karakeep/data"
    - dest: "{{ services_data_dir }}/karakeep/meilisearch"

  containers:
    - name: karakeep
      image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
      labels:
        traefik.enable: "true"
        traefik.http.services.karakeep.loadbalancer.server.port: "3000"
      volumes:
        - "{{ services_data_dir }}/karakeep/data:/data"
      env:
        DATA_DIR: /data
        NEXTAUTH_URL: "{{ karakeep_url }}"
        NEXTAUTH_SECRET: "{{ karakeep_nextauth_secret }}"
        MEILI_ADDR: http://karakeep-meilisearch:7700
        MEILI_MASTER_KEY: "{{ karakeep_meili_master_key }}"
        BROWSER_WEB_URL: http://karakeep-chrome:9222
        OPENAI_API_KEY: "{{ karakeep_openai_api_key }}"

    - name: karakeep-chrome
      image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:c51a8c8e6c3c1040a50fa0ecfd0b2fc298401b4229262636552458151f6f18fa
      init: true
      command:
        - --disable-gpu
        - --disable-dev-shm-usage
        - --hide-scrollbars
        - --disable-blink-features=AutomationControlled
        - --window-size=1440,900

    - name: karakeep-meilisearch
      image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
      volumes:
        - "{{ services_data_dir }}/karakeep/meilisearch:/meili_data"
      env:
        MEILI_NO_ANALYTICS: "true"
        MEILI_MASTER_KEY: "{{ karakeep_meili_master_key }}"
