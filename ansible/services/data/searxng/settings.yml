---
# Only what differs from upstream's defaults: https://docs.searxng.org/admin/settings/index.html
use_default_settings:
  engines:
    # A short list keeps each query fast and light. Left out: google (403) and duckduckgo (CAPTCHA)
    # block the vps's datacenter IP; mojeek and startpage are inactive upstream (proof-of-work CAPTCHAs).
    keep_only: [bing, brave, wikipedia]
engines:
  # Upstream disables it by default.
  - name: bing
    disabled: false
search:
  # Hermes reads /search?format=json.
  formats: [html, json]
