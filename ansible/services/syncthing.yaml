---
syncthing:
  description: File sync between devices

  files:
    - dest: "{{ services_data_dir }}/syncthing/config"
    - dest: "{{ services_data_dir }}/syncthing/data"

  containers:
    - image: ghcr.io/syncthing/syncthing:2.0.9@sha256:e1bc00b65c67e3d76f455af8bab01f95a380cd1962dd3bdfa52a702f07f0a5d0
      network_mode: host
      userns_mode: host
      labels:
        traefik.enable: "true"
        traefik.http.services.syncthing.loadbalancer.server.port: "8384"
      volumes:
        - "{{ services_data_dir }}/syncthing/config:/var/syncthing/config"
        - "{{ services_data_dir }}/syncthing/data:/var/syncthing/data"
      healthcheck:
        test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
        interval: 1m
        timeout: 10s
        retries: 3
