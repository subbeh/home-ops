---
# Hermes Agent: a personal assistant on OpenCode Go models, chatted with over Discord, with its
# dashboard at https://hermes.vps.sbbh.cloud. The dashboard refuses a non-loopback bind
# without an auth provider, so it uses the bundled basic auth.
#
# One-time setup, after the first Deploy:
#   1. Pick the model (Hermes owns config.yaml and edits it itself, so Ansible never writes it):
#      `docker exec -it hermes hermes model`, choosing provider opencode-go.
#   2. Under `dashboard:` in /opt/data/hermes/data/config.yaml set
#      `public_url: https://hermes.vps.sbbh.cloud` and `trusted_proxies:` the services
#      network's subnet (`docker network inspect services`), so traefik's X-Forwarded-Proto counts.
#   3. Plugins live in the data dir, Python deps included, so they survive recreation:
#      `hermes plugins install <name> --yes-deps --enable` for hermes-memory-wiki, langfuse and
#      advanced-delegation. Then `hermes delegation config` with backend model_map and routes on
#      provider opencode-go: `fast` (default; deepseek-v4.1-flash, for lookups and research) and
#      `deep` (deepseek-v4-pro, for hard reasoning), so cheap subagents stay cheap.
#   4. `hermes config set approvals.mode manual`: the default `smart` lets a model approve
#      dangerous commands; manual asks in Discord and denies after 5 minutes.
#   5. Kanban team, as profiles cloned from default (`hermes profile create <p> --clone`), no own
#      bots; goals start with `/kanban create --triage` in Discord, which gets each card's notices.
#      Models: orchestrator deepseek-v4.1-flash, researcher glm-5.3-flash (tool-heavy, needs the
#      request allowance), writer deepseek-v4-pro, reviewer kimi-k3.1-pro (judges; another family
#      than the writer so it doesn't favour its own output). Hermes drafted each description and
#      SOUL.md; the user approved them. `kanban.orchestrator_profile: orchestrator`,
#      `kanban.default_assignee: researcher`, and the orchestrator's cli toolsets are kanban and
#      memory only, so it routes work instead of doing it. `kanban.review_dispatch: false`: the
#      reviewer runs as an ordinary card, so the review lane stays a manual gate. No ops profile
#      on the board. Every Discord subscription stays on plain notices, which carry the summary and
#      the result files: /kanban create's notify+wake would wake default, which has no kanban tools
#      and digs through kanban.db instead. The hermes-kanban-notices post-task keeps it that way.
#
# A Deploy that recreates the container kills running Kanban workers. The fixed hostname below
# lets the gateway's dispatcher see their claims as its own and requeue the cards on its next
# tick, so they rerun from the start without manual steps. Each such kill counts as a failure
# toward the card's retry limit.
#
# Provider and tool keys go into each profile's own .env, not into env below: under the
# multiplexed gateway a non-default profile reads secrets only from its .env, never from the
# container (https://github.com/NousResearch/hermes-agent/issues/147922). The post-task writes
# each hermes_profiles entry's key sets from BWS as a marked block at the end of that profile's
# .env, leaving the lines Hermes writes there alone, and restarts hermes when a block changed.
# So a rotation lands on the next Deploy. Keys saved in the dashboard (Providers > API keys)
# sit outside the block and lose to it; don't save them there.
#
# Adding a profile: `hermes profile create <name> --clone`, list it under hermes_profiles,
# Deploy. --clone copies the source's .env, so delete any key outside the block that the new
# profile shouldn't have. Discord settings stay in env: they belong to the default profile only.
# See https://hermes-agent.nousresearch.com/docs/user-guide/docker
hermes:
  description: Hermes Agent, a personal assistant on OpenCode Go reached over Discord

  no_log: true

  vars:
    hermes_key_sets:
      model:
        OPENCODE_GO_API_KEY: "{{ bws_secrets.HERMES_OPENCODE_GO_API_KEY }}"
        # Langfuse Cloud traces for the langfuse plugin; metadata capture keeps chat content off it.
        HERMES_LANGFUSE_PUBLIC_KEY: "{{ bws_secrets.HERMES_LANGFUSE_PUBLIC_KEY }}"
        HERMES_LANGFUSE_SECRET_KEY: "{{ bws_secrets.HERMES_LANGFUSE_SECRET_KEY }}"
        HERMES_LANGFUSE_CAPTURE: metadata
      web:
        FIRECRAWL_API_KEY: "{{ bws_secrets.HERMES_FIRECRAWL_API_KEY }}"
    # Profile name: the key sets its .env gets. A listed profile that doesn't exist yet is skipped.
    hermes_profiles:
      default: [model, web]
      orchestrator: [model, web]
      researcher: [model, web]
      writer: [model, web]
      reviewer: [model, web]

  tasks:
    post: [hermes-profile-keys.yaml, hermes-kanban-notices.yaml]

  files:
    - dest: "{{ services_data_dir }}/hermes/data"

  containers:
    - image: nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
      command: [gateway, run]
      # Kanban claims carry the hostname, and the dispatcher reclaims dead workers only for its own
      # host; the default (the container ID) changes on each recreate, leaving cards to the 15m TTL.
      hostname: hermes
      # The vps has no swap, so a runaway agent would OOM other Services; this keeps it in its own
      # cgroup. About 0.8 GB at rest; the rest is headroom for Kanban workers and tool runs.
      memory: 2g
      cpus: 1.5
      labels:
        traefik.enable: "true"
        traefik.http.services.hermes.loadbalancer.server.port: "9119"
      volumes:
        - "{{ services_data_dir }}/hermes/data:/opt/data"
        - "{{ services_data_dir }}/shared:/shared"
        # The docker-socket-proxy Service's filtered socket: proxy.sock, list and logs only.
        - "{{ services_data_dir }}/docker-socket-proxy:/run/docker-proxy:ro"
      env:
        # s6-overlay remaps its hermes user to these instead of PUID/PGID.
        HERMES_UID: "{{ services_uid | string }}"
        HERMES_GID: "{{ services_gid | string }}"
        HERMES_DASHBOARD: "1"
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ bws_secrets.HERMES_DASHBOARD_PASSWORD }}"
        # openssl rand -hex 32; signs the dashboard sessions, so logins survive restarts.
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ bws_secrets.HERMES_DASHBOARD_SECRET }}"
        DISCORD_BOT_TOKEN: "{{ bws_secrets.HERMES_DISCORD_BOT_TOKEN }}"
        DISCORD_ALLOWED_USERS: "{{ bws_secrets.HERMES_DISCORD_ALLOWED_USERS }}"
        DISCORD_HOME_CHANNEL: "1566222287483576340"
        DISCORD_FREE_RESPONSE_CHANNELS: "1566222287483576340"
        DISCORD_FREE_RESPONSE_AUTO_THREAD: "true"

  gatus:
    endpoints:
      # Every other path redirects to the login page.
      - name: hermes
        group: services
        url: "https://hermes.{{ services_domain }}/login"
        conditions:
          - "[STATUS] == 200"
      # The gateway's own port (8642) listens on loopback only; the dashboard reports its state.
      - name: hermes-gateway
        group: services
        url: "https://hermes.{{ services_domain }}/api/status"
        conditions:
          - "[STATUS] == 200"
          - "[BODY].gateway_running == true"
          - "[BODY].gateway_platforms.discord.state == connected"
