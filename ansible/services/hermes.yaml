---
# Hermes Agent: a personal assistant on OpenCode Go models, chatted with over Discord, with its
# dashboard at https://hermes.vps.sbbh.cloud. The dashboard refuses a non-loopback bind
# without an auth provider, so it uses the bundled basic auth. How it all fits together:
# docs/services/hermes/README.md.
#
# One-time setup, after the first Deploy:
#   1. Pick the model (Hermes owns config.yaml and edits it itself, so Ansible never writes it):
#      `docker exec -it hermes hermes model`, choosing provider opencode-go.
#   2. Under `dashboard:` in /opt/data/hermes/data/config.yaml set
#      `public_url: https://hermes.vps.sbbh.cloud` and `trusted_proxies:` the services
#      network's subnet (`docker network inspect services`), so traefik's X-Forwarded-Proto counts.
#   3. Plugins live in the data dir, Python deps included, so they survive recreation:
#      `hermes plugins install <name> --yes-deps --enable` for hermes-memory-wiki, langfuse and
#      advanced-delegation. Then `hermes delegation config` with backend model_map and routes on
#      provider opencode-go: `fast` (default; deepseek-v4.1-flash, for lookups and research) and
#      `deep` (deepseek-v4-pro, for hard reasoning), so cheap subagents stay cheap.
#   4. `hermes config set approvals.mode manual`: the default `smart` lets a model approve
#      dangerous commands; manual asks in Discord and denies after 5 minutes.
#   5. Kanban team (docs/services/hermes/kanban.md): profiles cloned from default, no own bots;
#      goals start with `/kanban create --triage` in Discord. Models: orchestrator
#      deepseek-v4.1-flash, researcher glm-5.3-flash, writer deepseek-v4-pro, reviewer
#      kimi-k3.1-pro (docs/services/hermes/profiles.md says why). Hermes drafted each description
#      and SOUL.md; the user approved them. `kanban.orchestrator_profile: orchestrator`,
#      `kanban.default_assignee: researcher`, `kanban.review_dispatch: false`,
#      `kanban.max_in_progress: 2` (read at gateway start, so `docker restart hermes`), and the
#      orchestrator's cli toolsets are kanban and memory only. No ops profile on the board. Discord
#      subscriptions stay on plain notices; the hermes-kanban-notices post-task keeps it that way.
#   6. Langfuse prices (docs/services/hermes/profiles.md): Hermes sends no cost for opencode-go, so
#      each model gets a Langfuse model definition (Settings > Models, match
#      `(?i)^(opencode-go/)?<model>$`) at the off-peak rates on https://opencode.ai/docs/go/, with
#      output_reasoning_tokens at the output rate. shortcut: DeepSeek peak hours bill double and
#      show at half; upgrade when Hermes reads the response's opencode.allowance as the actual cost.
#   7. Claude subscription fallback, default Profile only (docs/services/hermes/profiles.md),
#      https://github.com/NousResearch/hermes-official-plugins/tree/main/claude-subscription-directsdk.
#      As the hermes user (`docker exec -it -u hermes hermes ...`), so HOME is the data dir:
#      `npm install -g --prefix /opt/data/.local --allow-scripts=@anthropic-ai/claude-code
#      @anthropic-ai/claude-code` (the postinstall fetches the native binary;
#      the README lists the CLI version each model needs),
#      `hermes plugins install claude-subscription-directsdk --yes-deps`, then `claude auth login`
#      (the user's browser; credentials land in /opt/data/.claude). In default's config.yaml only,
#      `fallback_providers: [{provider: claude-subscription-directsdk-experimental, model: sonnet}]`;
#      a Profile cloned from default copies it, so `hermes -p <name> fallback clear` there.
#      Upgrade the CLI with the same npm install; the plugin turns off its auto-update.
#   8. ops Profile (docs/services/hermes/profiles.md): cloned from default, model
#      deepseek-v4.1-flash, the user-approved SOUL.md, fallback cleared, no Kanban description.
#      `hermes -p ops tools disable --platform discord web browser`: ops will hold Deploy
#      power, so no web page reaches its context. In default's config.yaml, `gateway.profile_routes`
#      sends #ops (`platform: discord`, `chat_id: "1567034921732808805"`) and its threads to ops.
#   9. homelab plugin, ops Profile only (docs/services/hermes/profiles.md): after the Deploy that
#      first copies it, `hermes -p ops plugins enable homelab`, then `docker restart hermes`.
#  10. ops cron job actions-failures (docs/services/hermes/profiles.md): every 15 min the
#      actions-failures.py pre-check, shipped below, wakes ops only for a newly failed GitHub
#      Actions run. Cron scripts get a scrubbed env, so
#      `hermes -p ops config set terminal.env_passthrough '[GITHUB_ACTIONS_TOKEN]'`, then
#      `hermes -p ops cron create "every 15m" "<prompt>" --name actions-failures
#      --script actions-failures.py --deliver discord:1567034921732808805`, with the prompt:
#      "The script output lists GitHub Actions runs of subbeh/home-ops that failed since the last
#      check, each with the log tail of its failed jobs. For each run, reply with its workflow,
#      branch and link, the failing step, the likely cause quoting the decisive log line, and the
#      fix to try. Diagnose only; change nothing."
#      shortcut: Hermes doesn't deliver a routed Profile's cron output once it has a local session
#      (https://github.com/NousResearch/hermes-agent/issues/144455), so diagnoses only reach ops'
#      cron/output; recheck delivery when a Hermes bump carries that fix.
#  11. Focus skills plan-day, start-task and wrap-up, default Profile only
#      (docs/services/hermes/README.md): drafted by Hermes, approved by the user, in
#      /opt/data/skills/productivity/<name>/SKILL.md. Edit them there, then `/reload-skills` in
#      Discord.
#  12. Cron jobs plan-day and wrap-up, default Profile (docs/services/hermes/profiles.md): daily
#      at the start and end of the personal day in USER.md, and a MEMORY.md entry tells Hermes to
#      move both when that changes. `hermes config set cron.mirror_delivery true`, so a reply to a
#      home-channel cron message keeps its context (plan-day waits for an answer). Then
#      `hermes cron create "45 6 * * *" "Start the plan-day skill: send only its energy question,
#      then wait for the reply." --name plan-day --skill plan-day --deliver discord`, and
#      `hermes cron create "0 21 * * *" "Start the wrap-up skill: open with its first question
#      about today, then wait for the reply." --name wrap-up --skill wrap-up --deliver discord`.
#  13. Default cron job morning-brief (docs/services/hermes/profiles.md): the morning-brief skill,
#      written beside the focus skills, reads the weather location and news topics from USER.md.
#      `hermes cron create "30 6 * * *" "Write today's morning brief." --name morning-brief
#      --skill morning-brief --deliver discord` (the home channel; the container's TZ is local).
#      With cron.mirror_delivery on, a Discord cron run opens a private thread the user can't
#      see, so the brief opts out: in /opt/hermes, `HERMES_HOME=/opt/data .venv/bin/python -c
#      'from cron.jobs import update_job; update_job("<id>", {"attach_to_session": False})'`.
#  14. Auxiliary models, every Profile (docs/services/hermes/profiles.md): on `auto` they use the
#      Profile's main model. For each Profile and each of compression, title_generation, approval
#      and background_review, `hermes -p <name> config set auxiliary.<task>.provider opencode-go`
#      and `... auxiliary.<task>.model deepseek-v4.1-flash`; `auxiliary.compression.reasoning_effort
#      low`; and `auxiliary.vision` the same way on glm-5.3-flash. `docker restart hermes` after.
#
# A Deploy kills running Kanban workers; the fixed hostname below lets their cards requeue
# (docs/services/hermes/kanban.md). Deploy from main only, after `hermes kanban list`.
#
# Config history: the hermes-config-history post-task commits the hand-edited config (config.yaml,
# SOUL.md, memories, skills, cron jobs, keys; data/hermes/config-history-exclude lists it) to a
# local git repo at :50 every hour. Roll a file back on the vps, from /opt/data/hermes/data:
# `sudo -u apps git --git-dir=../config-history log -p -- <file>`, then
# `sudo -u apps git --git-dir=../config-history checkout <commit> -- <file>`
# (docs/services/hermes/running.md#rolling-back-config).
#
# Provider and tool keys go into each profile's own .env, never into env below or the dashboard:
# the hermes-profile-keys post-task writes each hermes_profiles entry's key sets from BWS
# (docs/services/hermes/keys.md, https://github.com/NousResearch/hermes-agent/issues/147922).
#
# Adding a profile: `hermes profile create <name> --clone`, list it under hermes_profiles, Deploy,
# then delete keys outside the block it shouldn't have (docs/services/hermes/profiles.md). Discord
# settings stay in env: they belong to the default profile only.
# See https://hermes-agent.nousresearch.com/docs/user-guide/docker
hermes:
  description: Hermes Agent, a personal assistant on OpenCode Go reached over Discord

  no_log: true

  vars:
    hermes_key_sets:
      model:
        OPENCODE_GO_API_KEY: "{{ bws_secrets.HERMES_OPENCODE_GO_API_KEY }}"
        # Langfuse Cloud traces for the langfuse plugin; metadata capture keeps chat content off it.
        HERMES_LANGFUSE_PUBLIC_KEY: "{{ bws_secrets.HERMES_LANGFUSE_PUBLIC_KEY }}"
        HERMES_LANGFUSE_SECRET_KEY: "{{ bws_secrets.HERMES_LANGFUSE_SECRET_KEY }}"
        HERMES_LANGFUSE_CAPTURE: metadata
      web:
        FIRECRAWL_API_KEY: "{{ bws_secrets.HERMES_FIRECRAWL_API_KEY }}"
      # The aven-mcp container's bearer token (aven.yaml), read by config.yaml's mcp_servers.aven header.
      aven:
        AVEN_MCP_TOKEN: "{{ bws_secrets.AVEN_MCP_TOKEN }}"
      # The hermes-ops Semaphore user's token (Task Runner role), read by the homelab plugin.
      semaphore:
        HERMES_OPS_SEMAPHORE_TOKEN: "{{ bws_secrets.HERMES_OPS_SEMAPHORE_TOKEN }}"
      # Fine-grained, home-ops repo only, Actions: read. The actions-failures pre-check reads it;
      # job logs need a token even on a public repo.
      github:
        GITHUB_ACTIONS_TOKEN: "{{ bws_secrets.HERMES_GITHUB_ACTIONS_TOKEN }}"
    # Profile name: the key sets its .env gets. A listed profile that doesn't exist yet is skipped.
    hermes_profiles:
      default: [model, web, aven]
      orchestrator: [model, web]
      researcher: [model, web]
      writer: [model, web]
      reviewer: [model, web]
      ops: [model, semaphore, github]

  tasks:
    post: [hermes-profile-keys.yaml, hermes-kanban-notices.yaml, hermes-config-history.yaml]

  files:
    - dest: "{{ services_data_dir }}/hermes/data"
    # In ops' own plugins dir, so no other Profile can load its tools (ansible/services/data/).
    - dest: "{{ services_data_dir }}/hermes/data/profiles/ops/plugins/homelab"
      src: hermes/homelab
    # What homelab_deploy may start: this Host's Services minus semaphore (recreating it kills the
    # running task) and hermes (ops' own container).
    - dest: "{{ services_data_dir }}/hermes/data/profiles/ops/plugins/homelab/deployable.json"
      content: "{{ services | difference(['semaphore', 'hermes']) | to_json }}"
    - dest: "{{ services_data_dir }}/hermes/data/profiles/ops/scripts/actions-failures.py"
      src: hermes/actions-failures.py

  containers:
    - image: nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
      command: [gateway, run]
      # Kanban claims carry the hostname, and the dispatcher reclaims dead workers only for its own
      # host; the default (the container ID) changes on each recreate, leaving cards to the 15m TTL.
      hostname: hermes
      # The vps has no swap, so a runaway agent would OOM other Services; this keeps it in its own
      # cgroup. About 0.8-1.05 GB at rest, plus about 290 MB per Kanban worker, capped at 2 by
      # kanban.max_in_progress (docs/services/hermes/safety.md#resource-limits).
      memory: 2g
      cpus: 1.5
      labels:
        traefik.enable: "true"
        traefik.http.services.hermes.loadbalancer.server.port: "9119"
      volumes:
        - "{{ services_data_dir }}/hermes/data:/opt/data"
        - "{{ services_data_dir }}/shared:/shared"
        # The docker-socket-proxy Service's filtered socket: proxy.sock, list and logs only.
        - "{{ services_data_dir }}/docker-socket-proxy:/run/docker-proxy:ro"
      env:
        # s6-overlay remaps its hermes user to these instead of PUID/PGID.
        HERMES_UID: "{{ services_uid | string }}"
        HERMES_GID: "{{ services_gid | string }}"
        HERMES_DASHBOARD: "1"
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ bws_secrets.HERMES_DASHBOARD_PASSWORD }}"
        # openssl rand -hex 32; signs the dashboard sessions, so logins survive restarts.
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ bws_secrets.HERMES_DASHBOARD_SECRET }}"
        DISCORD_BOT_TOKEN: "{{ bws_secrets.HERMES_DISCORD_BOT_TOKEN }}"
        DISCORD_ALLOWED_USERS: "{{ bws_secrets.HERMES_DISCORD_ALLOWED_USERS }}"
        DISCORD_HOME_CHANNEL: "1566222287483576340"
        DISCORD_FREE_RESPONSE_CHANNELS: "1566222287483576340"
        DISCORD_FREE_RESPONSE_AUTO_THREAD: "true"

  gatus:
    endpoints:
      # Every other path redirects to the login page.
      - name: hermes
        group: services
        url: "https://hermes.{{ services_domain }}/login"
        conditions:
          - "[STATUS] == 200"
      # The gateway's own port (8642) listens on loopback only; the dashboard reports its state.
      - name: hermes-gateway
        group: services
        url: "https://hermes.{{ services_domain }}/api/status"
        conditions:
          - "[STATUS] == 200"
          - "[BODY].gateway_running == true"
          - "[BODY].gateway_platforms.discord.state == connected"
