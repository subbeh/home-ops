---
# Restored from the old setup's backup (pve-nas:/data/hdd0/backups/nvme/app_data/services/metube,
# state and cookies only) by copying it into nas-svc's data dir before the first Deploy.
# See https://github.com/alexta69/metube
metube:
  description: yt-dlp web UI that downloads into the media share

  # HAProxy on OPNsense forwards metube.<ingress_domain> to this port, which gluetun publishes.
  ingress:
    port: 8081

  files:
    - dest: "{{ services_data_dir }}/metube/state"
    - dest: "{{ services_data_dir }}/metube/cookies"
    - dest: "{{ services_data_dir }}/metube/cache"

  containers:
    # The image's own healthcheck curls the UI every 30s.
    - image: ghcr.io/alexta69/metube:2026.11.24@sha256:c423654da5b9d29b02a8092713607b906d63d17fd7e0a2f52228218a0d3e2a7b
      # Its traffic leaves through ProtonVPN: see gluetun.yaml.
      network_mode: container:gluetun
      volumes:
        # pve-nas's /data/hdd1/media, through nas-svc's mp1. Downloads land as host uid 102000
        # (services_uid in the LXC); the folder is 0777.
        - "/data/media/various/misc/new:/downloads"
        - "{{ services_data_dir }}/metube/cache:/cache"
        - "{{ services_data_dir }}/metube/state:/state"
        - "{{ services_data_dir }}/metube/cookies:/cookies"
      env:
        # The entrypoint chowns -R /downloads by default, which would hit every file in the share.
        CHOWN_DIRS: "false"
        TEMP_DIR: /cache
        STATE_DIR: /state
        DOWNLOAD_MODE: limited
        YTDL_OPTIONS: '{"cookiefile":"/cookies/cookies.txt"}'
        MAX_CONCURRENT_DOWNLOADS: "5"
        OUTPUT_TEMPLATE: "%(title)s_%(epoch)s.%(ext)s"
