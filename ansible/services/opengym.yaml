---
# Served over HTTPS by traefik, so passkey login works; password sign-in stays on
# for accounts created before that. See https://opengym.ch/docs.html#selfhost
#
# opengym-mcp serves openGym's MCP tools over HTTP for hermes. It holds no data: each request's
# scoped `ogt_` token reads through opengym-api, and only containers on the services network reach
# http://opengym-mcp:3100/mcp. opengym-web proxies /mcp to a container named `mcp`, which doesn't
# exist, so the tools stay off the public route. The token's setup is in hermes.yaml's header.
# See https://github.com/DuarteSantos8/openGym/blob/main/docs/MCP_REMOTE.md
opengym:
  description: Workout tracker

  files:
    - dest: "{{ services_data_dir }}/opengym/data"

  containers:
    - name: opengym-api
      image: ghcr.io/duartesantos8/opengym-api:1.4.5@sha256:397c83e9ac33a413bc8f21e66b2e55038100fc7f9da900d80be28b30fbb12ea8
      volumes:
        - "{{ services_data_dir }}/opengym/data:/data"
      env:
        PORT: "3000"
        DATA_DIR: /data
        TRUST_PROXY: "1"
        RP_ID: "gym.{{ services_domain }}"
        ORIGIN: "https://gym.{{ services_domain }}"
        PASSWORD_LOGIN: "1"
        ADMIN_UIDS: "IR5d1HqhGAGj2mqy"  # disable on next bootstrap
        # FIRST_USER_ADMIN: "1" # enable on next bootstrap

    - name: opengym-web
      image: ghcr.io/duartesantos8/opengym-web:1.4.5@sha256:e621677554302a0e1745e3b8c90acddc7d7149e118c4d683d51c13aa88f47d27
      # The image checks every 5m, and traefik skips containers until they're healthy.
      healthcheck:
        interval: 30s
      labels:
        traefik.enable: "true"
        traefik.http.routers.opengym.rule: "Host(`gym.{{ services_domain }}`)"
        traefik.http.services.opengym.loadbalancer.server.port: "80"
      env:
        BACKEND: opengym-api
        PORT: "3000"

    - name: opengym-mcp
      image: ghcr.io/duartesantos8/opengym-mcp:1.4.5@sha256:f1f1a48ac79f8c7ea762ca30770764ec961e7c6901b28dd97dff47170f8af5c9
      memory: 128m
      env:
        OPENGYM_API_URL: http://opengym-api:3000
        # Turns away browser pages from other origins; hermes sends no Origin.
        ORIGIN: "https://gym.{{ services_domain }}"

  gatus:
    endpoints:
      # Through opengym-web to opengym-api, so it covers both.
      - name: opengym
        group: vps
        url: "https://gym.{{ services_domain }}/api/health"
        conditions:
          - "[STATUS] == 200"
      # Needs no token; whether hermes's token still works isn't checked.
      - name: opengym-mcp
        group: vps
        url: "http://opengym-mcp:3100/mcp/health"
        conditions:
          - "[STATUS] == 200"
