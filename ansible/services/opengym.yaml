---
# Served over HTTPS by traefik, so passkey login works; password sign-in stays on
# for accounts created before that. See https://opengym.ch/docs.html#selfhost
opengym:
  description: Workout tracker

  files:
    - dest: "{{ services_data_dir }}/opengym/data"

  containers:
    - name: opengym-api
      image: ghcr.io/duartesantos8/opengym-api:1.4.4@sha256:7508ecca4ae16a917e6e58e3fd40961fbdf7d5fbfc54b7e6f434f741ddf41402
      volumes:
        - "{{ services_data_dir }}/opengym/data:/data"
      env:
        PORT: "3000"
        DATA_DIR: /data
        TRUST_PROXY: "1"
        RP_ID: "gym.{{ services_domain }}"
        ORIGIN: "https://gym.{{ services_domain }}"
        PASSWORD_LOGIN: "1"
        ADMIN_UIDS: "IR5d1HqhGAGj2mqy"  # disable on next bootstrap
        # FIRST_USER_ADMIN: "1" # enable on next bootstrap

    - name: opengym-web
      image: ghcr.io/duartesantos8/opengym-web:1.4.5@sha256:e621677554302a0e1745e3b8c90acddc7d7149e118c4d683d51c13aa88f47d27
      # The image checks every 5m, and traefik skips containers until they're healthy.
      healthcheck:
        interval: 30s
      labels:
        traefik.enable: "true"
        traefik.http.routers.opengym.rule: "Host(`gym.{{ services_domain }}`)"
        traefik.http.services.opengym.loadbalancer.server.port: "80"
      env:
        BACKEND: opengym-api
        PORT: "3000"

  gatus:
    endpoints:
      # Through opengym-web to opengym-api, so it covers both.
      - name: opengym
        group: services
        url: "https://gym.{{ services_domain }}/api/health"
        conditions:
          - "[STATUS] == 200"
