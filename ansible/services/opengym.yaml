---
# Served over HTTPS by traefik, so passkey login works; password sign-in stays on
# for accounts created before that. See https://opengym.ch/docs.html#selfhost
opengym:
  files:
    - dest: "{{ services_data_dir }}/opengym/data"

  containers:
    - name: opengym-api
      image: ghcr.io/duartesantos8/opengym-api:1.4.1
      volumes:
        - "{{ services_data_dir }}/opengym/data:/data"
      env:
        PORT: "3000"
        DATA_DIR: /data
        TRUST_PROXY: "1"
        RP_ID: "opengym.{{ services_domain }}"
        ORIGIN: "https://opengym.{{ services_domain }}"
        PASSWORD_LOGIN: "1"

    - name: opengym-web
      image: ghcr.io/duartesantos8/opengym-web:1.4.1
      labels:
        traefik.enable: "true"
        traefik.http.routers.opengym.rule: "Host(`opengym.{{ services_domain }}`)"
        traefik.http.services.opengym.loadbalancer.server.port: "80"
      env:
        BACKEND: opengym-api
        PORT: "3000"
