---
# The home ingress's canary: Gatus's check of https://whoami.svc.sbbh.cloud proves the DNS
# wildcard, the cert and HAProxy's route to nas-svc. See https://github.com/traefik/whoami
whoami:
  description: Echoes each request back, as the home ingress's canary

  # HAProxy on OPNsense forwards whoami.<ingress_domain> to this published port.
  ingress:
    port: 8080

  containers:
    - image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
      ports:
        - "8080:80"
