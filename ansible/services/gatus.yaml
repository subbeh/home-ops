---
# Status dashboard, plus a dead-man's-switch for restic's hourly backup: restic
# pushes to its "external endpoint" (declared in restic.yaml) after every run, and Gatus
# alerts if a push doesn't arrive within the heartbeat interval. Services declare their
# own endpoints under `gatus:`, merged in from services_gatus_dir. See https://github.com/TwiN/gatus
gatus:
  description: Status dashboard, plus the dead-man's switch for restic backups

  no_log: true

  files:
    - dest: "{{ services_data_dir }}/gatus/data"
    - dest: "{{ services_gatus_dir }}/config.yaml"
      content: |
        storage:
          type: sqlite
          path: /data/data.db

        ui:
          default-sort-by: group

        alerting:
          pushover:
            application-token: "{{ bws_secrets.GATUS_PUSHOVER_APP_TOKEN }}"
            user-key: "{{ bws_secrets.GATUS_PUSHOVER_USER_KEY }}"

        endpoints:
          - name: tailscale-dns
            group: tailscale
            url: "icmp://100.100.100.100"
            interval: 1m
            conditions:
              - "[CONNECTED] == true"
            alerts:
              - type: pushover
                send-on-resolved: true
          - name: openwrt-home
            group: tailscale
            url: "icmp://gl-router-home"
            interval: 5m
            conditions:
              - "[CONNECTED] == true"
            alerts:
              - type: pushover
                send-on-resolved: true
          - name: openwrt-wollert
            group: tailscale
            url: "icmp://gl-router-wollert"
            interval: 5m
            conditions:
              - "[CONNECTED] == true"
            alerts:
              - type: pushover
                send-on-resolved: true

  containers:
    - image: ghcr.io/twin/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
      labels:
        traefik.enable: "true"
        traefik.http.routers.gatus.rule: "Host(`status.{{ services_domain }}`)"
        traefik.http.services.gatus.loadbalancer.server.port: "8080"
      volumes:
        # The dir, not the file: Gatus misses updates to a bind-mounted file (TwiN/gatus#151).
        - "{{ services_gatus_dir }}:/config"
        - "{{ services_data_dir }}/gatus/data:/data"
      env:
        GATUS_CONFIG_PATH: /config

  gatus:
    endpoints:
      # Only proves Traefik routes here: a stopped Gatus can't alert about itself.
      - name: gatus
        group: services
        url: "https://status.{{ services_domain }}/health"
        conditions:
          - "[STATUS] == 200"
