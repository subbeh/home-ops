---
# Status dashboard, plus a dead-man's-switch for restic's hourly backups: restic on each Host
# pushes to its "external endpoints" (in backups.yaml below) after every run, and Gatus
# alerts if a push doesn't arrive within the heartbeat interval. Services declare their
# own endpoints under `gatus:`, merged in from services_gatus_dir. See https://github.com/TwiN/gatus
gatus:
  description: Status dashboard, plus the dead-man's switch for restic backups

  no_log: true

  files:
    - dest: "{{ services_data_dir }}/gatus/data"
    - dest: "{{ services_gatus_dir }}/config.yaml"
      content: |
        storage:
          type: sqlite
          path: /data/data.db

        ui:
          default-sort-by: group

        alerting:
          pushover:
            application-token: "{{ bws_secrets.GATUS_PUSHOVER_APP_TOKEN }}"
            user-key: "{{ bws_secrets.GATUS_PUSHOVER_USER_KEY }}"

        endpoints:
          - name: tailscale-dns
            group: tailscale
            url: "icmp://100.100.100.100"
            interval: 1m
            conditions:
              - "[CONNECTED] == true"
            alerts:
              - type: pushover
                send-on-resolved: true
          - name: openwrt-home
            group: tailscale
            url: "icmp://gl-router-home"
            interval: 5m
            conditions:
              - "[CONNECTED] == true"
            alerts:
              - type: pushover
                send-on-resolved: true
          - name: openwrt-wollert
            group: tailscale
            url: "icmp://gl-router-wollert"
            interval: 5m
            conditions:
              - "[CONNECTED] == true"
            alerts:
              - type: pushover
                send-on-resolved: true
    # A ping per home address, from network.yaml: see the gatus_endpoints filter.
    - dest: "{{ services_gatus_dir }}/home.yaml"
      content: "{{ {'endpoints': networks | gatus_endpoints(devices)} | to_nice_yaml(indent=2) }}"
    # The backup heartbeats of each Host restic is assigned to: its backups (Storage Box and
    # pve-nas) and its SQLite copies push here (restic.yaml), so a new restic Host needs a Deploy of gatus.
    - dest: "{{ services_gatus_dir }}/backups.yaml"
      content: |
        external-endpoints:
        {% for host in groups['all'] if 'restic' in hostvars[host].services | default([]) %}
          - name: restic-backup-{{ host }}
            group: backups
            token: {{ bws_secrets.GATUS_EXTERNAL_TOKEN | to_json }}
            heartbeat:
              interval: 1h
            alerts:
              - type: pushover
                description: "restic hourly backup on {{ host }} hasn't checked in"
                send-on-resolved: true
          - name: restic-nas-backup-{{ host }}
            group: backups
            token: {{ bws_secrets.GATUS_EXTERNAL_TOKEN | to_json }}
            heartbeat:
              interval: 1h
            alerts:
              - type: pushover
                description: "restic hourly backup to pve-nas on {{ host }} hasn't checked in"
                send-on-resolved: true
          - name: sqlite-copies-{{ host }}
            group: backups
            token: {{ bws_secrets.GATUS_EXTERNAL_TOKEN | to_json }}
            heartbeat:
              interval: 1h
            alerts:
              - type: pushover
                description: "SQLite copies before the restic backup on {{ host }} failed or didn't run"
                send-on-resolved: true
        {% endfor %}
    # An HTTPS check per home ingress route: see the ingress_routes filter. Private Services are
    # left out, since Semaphore's Auto-deploys can't see their files and would drop them.
    - dest: "{{ services_gatus_dir }}/ingress.yaml"
      content: >-
        {{ {'endpoints': hostvars | ingress_routes(groups['local'], services_configs, networks)
            | rejectattr('service', 'in', query('fileglob', services_root ~ '/*.private.yaml') | map('basename') | map('regex_replace', '\.private\.yaml$', ''))
            | ingress_gatus_endpoints(ingress_domain, networks.tailnet.addresses.opnsense)} | to_nice_yaml(indent=2) }}

  containers:
    - image: ghcr.io/twin/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
      labels:
        traefik.enable: "true"
        traefik.http.routers.gatus.rule: "Host(`status.{{ services_domain }}`)"
        traefik.http.services.gatus.loadbalancer.server.port: "8080"
      volumes:
        # The dir, not the file: Gatus misses updates to a bind-mounted file (TwiN/gatus#151).
        - "{{ services_gatus_dir }}:/config"
        - "{{ services_data_dir }}/gatus/data:/data"
      env:
        GATUS_CONFIG_PATH: /config

  gatus:
    endpoints:
      # Only proves Traefik routes here: a stopped Gatus can't alert about itself.
      - name: gatus
        group: services
        url: "https://status.{{ services_domain }}/health"
        conditions:
          - "[STATUS] == 200"
