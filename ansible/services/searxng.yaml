---
# Metasearch for Hermes's web_search, so searches stop spending Firecrawl credits; page reads
# (web_extract) stay on Firecrawl (docs/services/hermes/README.md#web-search-and-page-reads).
# Internal only: no Traefik labels, so only containers on the services network reach it.
# See https://docs.searxng.org/admin/installation-docker.html
searxng:
  description: SearXNG metasearch, the web search backend for Hermes

  no_log: true

  files:
    # The image's entrypoint chowns /etc/searxng to its searxng user (977) at every start.
    - dest: "{{ services_data_dir }}/searxng"
      src: searxng
      owner: 977
      group: 977

  containers:
    - image: searxng/searxng:2026.11.8-3a3dd15bf@sha256:bed9946e14c009da4efdb477545eb48eb8d1d87af25e9738ff8b8584cb89a311
      # The vps has no swap, so a leak must not OOM other Services.
      memory: 256m
      volumes:
        - "{{ services_data_dir }}/searxng:/etc/searxng"
      env:
        SEARXNG_SECRET: "{{ bws_secrets.SEARXNG_SECRET_KEY }}"

  gatus:
    endpoints:
      - name: searxng
        group: services
        url: http://searxng:8080/healthz
        conditions:
          - "[STATUS] == 200"
