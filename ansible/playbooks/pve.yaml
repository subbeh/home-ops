---
# Configures the Proxmox VE Hosts after the manual install (docs/runbooks/pve-nas.md): apt
# sources, microcode, SSH, the storage bridge, the API user and the NFS exports. From the laptop
# only: always `--check --diff` first, and never Auto-deployed. Needs the mise env
# (BWS_ACCESS_TOKEN).
- name: Configure Proxmox VE
  hosts: pve
  pre_tasks:
    # On the controller. A command rather than a pipe lookup so it can retry: the Bitwarden API
    # fails now and then.
    - name: Read secrets from Bitwarden Secrets Manager
      ansible.builtin.command: bws secret list --output json
      delegate_to: localhost
      become: false
      run_once: true
      register: _bws
      retries: 3
      delay: 5
      until: _bws.rc == 0
      changed_when: false
      check_mode: false
      no_log: true

    - name: Load secrets from Bitwarden Secrets Manager
      ansible.builtin.set_fact:
        bws_secrets: "{{ _bws.stdout | from_json | items2dict(key_name='key', value_name='value') }}"
      no_log: true
  roles:
    - pve_setup
