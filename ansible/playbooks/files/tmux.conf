# Managed by home-ops (playbooks/hosts.yaml): edits here are overwritten.
# The core keys of the laptop's tmux config (dotfiles tmux/.config/tmux/{env,keymaps}.conf), plain
# tmux with no plugins. Same prefix C-s: inside the laptop's tmux, C-s C-s <key> reaches this one
# through the laptop's send-prefix binding.

set -g prefix C-s
unbind C-b
bind C-s send-prefix
set -s escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g mouse on
set -g status-keys vi
setw -g mode-keys vi
# Yanks reach the laptop's clipboard over OSC 52, through the laptop's tmux.
set -g set-clipboard on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Nested, the laptop's tmux takes C-h/C-l itself (its vim-aware pane keys); n and p, tmux's
# defaults, still switch windows here.
bind -r C-l select-window -t :+
bind -r C-h select-window -t :-

bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Amber status bar with the hostname, so the nested session stands out from the laptop's.
set -g status-style "bg=colour214,fg=colour232"
set -g status-left "[#H:#S] "
set -g status-left-length 30
