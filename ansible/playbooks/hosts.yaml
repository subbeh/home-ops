---
# Base setup shared by every Debian and Ubuntu Host: the core packages in group_vars/debian.yaml.
# From the laptop only, `--check --diff` first; never Auto-deployed. Needs the mise env
# (BWS_ACCESS_TOKEN). nas-svc and nuc-svc need a pve.yaml run first, which installs their Python.
- name: Configure Hosts
  hosts: debian
  vars:
    # One iperf3 server per box: an LXC guest shares its node's NIC, so the node serves for both.
    _iperf3_serve: "{{ ansible_virtualization_type != 'lxc' }}"
  pre_tasks:
    # On the controller. A command rather than a pipe lookup so it can retry: the Bitwarden API
    # fails now and then.
    - name: Read secrets from Bitwarden Secrets Manager
      ansible.builtin.command: bws secret list --output json
      delegate_to: localhost
      become: false
      run_once: true
      register: _bws
      retries: 3
      delay: 5
      until: _bws.rc == 0
      changed_when: false
      check_mode: false
      no_log: true

    - name: Load secrets from Bitwarden Secrets Manager
      ansible.builtin.set_fact:
        bws_secrets: "{{ _bws.stdout | from_json | items2dict(key_name='key', value_name='value') }}"
      no_log: true
  tasks:
    # Without this, installing iperf3 starts a server listening on every interface, before the
    # drop-in below binds it. The packaged unit keeps the server running from then on.
    - name: Keep iperf3's install from starting its server
      ansible.builtin.debconf:
        name: iperf3
        question: iperf3/start_daemon
        value: "false"
        vtype: boolean

    - name: Install the core packages
      ansible.builtin.apt:
        name: "{{ core_packages }}"
        update_cache: true
        cache_valid_time: 3600

    # Home Hosts bind their servers address, which the tailnet also reaches through OPNsense's
    # subnet route; the vps binds its tailnet address, since its firewall accepts everything. The
    # packaged unit (Debian and Ubuntu) has Restart=always and RestartSec=15, so it retries the bind
    # until tailscaled is up without tripping the default start limit (5 starts in 10s).
    - name: Create the iperf3 drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/iperf3.service.d
        state: "{{ 'directory' if _iperf3_serve else 'absent' }}"
        mode: "0755"

    - name: Bind the iperf3 server to the Host's servers or tailnet address
      ansible.builtin.copy:
        dest: /etc/systemd/system/iperf3.service.d/bind.conf
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/iperf3 --server --interval 0 --bind {{ networks.servers.addresses[inventory_hostname] | default(networks.tailnet.addresses[inventory_hostname]) }}
      register: _iperf3_bind
      when: _iperf3_serve

    - name: Run the iperf3 server
      ansible.builtin.systemd_service:
        name: iperf3
        enabled: "{{ _iperf3_serve }}"
        state: "{{ 'stopped' if not _iperf3_serve else 'restarted' if _iperf3_bind is changed else 'started' }}"
        daemon_reload: "{{ _iperf3_bind is changed or not _iperf3_serve }}"

    # For Semaphore's hosts-update template. lineinfile, not authorized_key: on pve Hosts the file
    # links to /etc/pve/priv/authorized_keys, and lineinfile writes through the link.
    - name: Authorize Semaphore's SSH key for the Ansible user
      ansible.builtin.lineinfile:
        path: "~{{ ansible_user }}/.ssh/authorized_keys"
        # Type and key only, plus the comment the line on the vps already has, so it matches.
        line: "{{ (bws_secrets.SEMAPHORE_SSH_PUBLIC_KEY.split()[:2] + ['semaphore']) | join(' ') }}"

    # For root's interactive shells only: scripts never expand aliases. The marker is the old
    # archive role's, so its block on older Hosts is replaced in place.
    - name: Add the shell aliases to root's .bashrc
      ansible.builtin.blockinfile:
        path: /root/.bashrc
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - COMMON ALIASES"
        block: |
          alias ll='ls -la --color=auto'
          alias la='ls -A --color=auto'
          alias lt='ls -ltra --color=auto'
          alias l='ls -CF --color=auto'
          alias ..='cd ..'
          alias ...='cd ../..'
          alias df='df -h'
          alias du='du -h'
          alias free='free -h'
          alias ports='ss -tulpn'
          alias grep='grep --color=auto'
          alias ip='ip -c'
          alias diff='diff --color=auto'
          alias dmesg='dmesg --color=auto'
          # Refuse to replace a file, with an error: --update=none-fail needs coreutils 9.5+, -n fails the same way only on 9.2-9.4 (the vps).
          if mv --update=none-fail --version >/dev/null 2>&1; then alias mv='mv --update=none-fail'; else alias mv='mv -n'; fi

    - name: Install root's tmux config
      ansible.builtin.copy:
        src: tmux.conf
        dest: /root/.tmux.conf
        mode: "0644"
