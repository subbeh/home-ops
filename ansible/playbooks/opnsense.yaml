---
# Configures OPNsense through its API, from the laptop only: always `--check --diff` first, and
# never Auto-deployed. The steps the API can't do are in docs/runbooks/opnsense.md. Needs the mise
# env (BWS_ACCESS_TOKEN) and the tailnet up.
- name: Configure OPNsense
  hosts: opnsense
  gather_facts: false
  become: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ ansible_host }}"
      # The UI left :443 for the home ingress (docs/runbooks/opnsense.md).
      api_port: 8443
      api_key: "{{ bws_secrets.OPNSENSE_API_KEY }}"
      api_secret: "{{ bws_secrets.OPNSENSE_API_SECRET }}"
  vars:
    # Every Network OPNsense is the gateway of, with its device, address and Kea pool.
    _interfaces: "{{ networks | router_interfaces(devices[inventory_hostname].ports, port_devices, inventory_hostname) }}"
    # Exceptions to network.yaml's DNS rule: UniFi gear adopts through the controller on the VPS, and
    # opnsense has an address on every Network, so its short name picks mgmt's.
    _dns_extra:
      - {hostname: unifi, domain: "{{ home_domain }}", value: "{{ networks.tailnet.addresses.vps }}"}
      # Factory-default gear (the Flex Mini, which has no SSH for set-inform) asks for the bare
      # name `unifi.` and never appends the DHCP domain; an empty host makes the record the domain.
      - {hostname: "", domain: unifi, value: "{{ networks.tailnet.addresses.vps }}"}
      - {hostname: opnsense, domain: "{{ home_domain }}", value: "{{ networks.mgmt.addresses.opnsense }}"}
      # Gatus on the VPS, for the backup heartbeats from the home Hosts (services/restic.yaml). The
      # public record points at the tailnet address too, but Unbound's rebind check drops it.
      - {hostname: status, domain: vps.sbbh.cloud, value: "{{ networks.tailnet.addresses.vps }}"}
      # The home ingress: HAProxy answers every name and knows the routes. Under its own domain,
      # since a wildcard on home_domain would hide the names above.
      - {hostname: "*", domain: "{{ ingress_domain }}", value: "{{ networks.servers.addresses.opnsense }}"}
    # The home ingress's routes: every Service with an `ingress:` port on a local Host.
    _ingress_routes: "{{ hostvars | ingress_routes(groups['local'], services_configs, networks) }}"
    _certs: [opnsense.sbbh.cloud, "*.{{ ingress_domain }}"]
  tasks:
    # Private Services (<name>.private.yaml, gitignored) included.
    - name: Load service definitions
      ansible.builtin.include_vars:
        dir: "{{ services_root }}"
        files_matching: '\.ya?ml$'
        depth: 1
        name: services_configs

    - name: Require a file for every Service on a local Host
      ansible.builtin.assert:
        that: _missing | length == 0
        fail_msg: >-
          No Service file for {{ _missing | join(', ') }}. A private Service's <name>.private.yaml
          is only in the main checkout: run from there, or this run drops its route.
        quiet: true
      vars:
        _missing: >-
          {{ groups['local'] | map('extract', hostvars, 'services') | map('default', [], true)
             | flatten | difference(services_configs.keys() | list) }}

    # A command rather than a pipe lookup so it can retry: the Bitwarden API fails now and then.
    - name: Read secrets from Bitwarden Secrets Manager
      ansible.builtin.command: bws secret list --output json
      register: _bws
      retries: 3
      delay: 5
      until: _bws.rc == 0
      changed_when: false
      check_mode: false
      no_log: true

    - name: Load secrets from Bitwarden Secrets Manager
      ansible.builtin.set_fact:
        bws_secrets: "{{ _bws.stdout | from_json | items2dict(key_name='key', value_name='value') }}"
      no_log: true

    # The status endpoint only reports the last check, so run one first. It only refreshes the
    # package catalogue, so it also runs in check mode.
    - name: Check for firmware updates
      oxlorg.opnsense.raw:
        url: core/firmware/check
        action: post
      changed_when: false
      check_mode: false

    - name: Wait for the firmware check
      oxlorg.opnsense.raw:
        url: core/firmware/upgradestatus
      register: _check
      until: _check.response.status == 'done'
      retries: 30
      delay: 2

    - name: Read the firmware status
      oxlorg.opnsense.raw:
        url: core/firmware/status
      register: _firmware

    # Minor updates only: a major upgrade ('upgrade' status) goes through the UI, together with
    # the collection bump (docs/runbooks/opnsense.md).
    - name: Update the firmware
      oxlorg.opnsense.system:
        action: update
        # The default 90s is too short for a package update; plugins can't install until it's done.
        wait_timeout: 600
      when: _firmware.response.status == 'update'

    - name: Install plugins
      oxlorg.opnsense.package:
        name: "{{ plugins }}"
        action: install
      register: _plugins

    # The install only starts a firmware job; the plugins' APIs 404 until it's done.
    - name: Wait for the plugin install
      oxlorg.opnsense.raw:
        url: core/firmware/upgradestatus
      register: _install
      until: _install.response.status == 'done'
      retries: 60
      delay: 5
      when: _plugins is changed and not ansible_check_mode

    # ACME cert for the UI, issued by Let's Encrypt with a Cloudflare DNS-01 challenge. Traefik's
    # token is reused: acme.sh finds the zone with it, so no zone or account ID is needed.
    - name: Enable the ACME client
      oxlorg.opnsense.acme_general:
        enabled: true

    - name: Add the Let's Encrypt account
      oxlorg.opnsense.acme_account:
        name: letsencrypt
        description: Let's Encrypt
        ca: letsencrypt

    # The module reports changed on every dns01 run (it can't compare the token), so it runs only
    # when the validation differs from what the API returns, token included.
    - name: Read the ACME validations
      oxlorg.opnsense.raw:
        url: acmeclient/validations/search
      register: _acme_validations
      check_mode: false
      no_log: true

    - name: Add the Cloudflare DNS-01 validation
      oxlorg.opnsense.acme_validation:
        name: cloudflare
        description: Cloudflare DNS-01
        method: dns01
        dns_service: dns_cf
        dns_cf_token: "{{ bws_secrets.CLOUDFLARE_API_TOKEN }}"
      when: >-
        _acme_validations.response.rows | selectattr('name', '==', 'cloudflare')
        | selectattr('description', '==', 'Cloudflare DNS-01') | selectattr('method', '==', 'dns01')
        | selectattr('dns_service', '==', 'dns_cf')
        | selectattr('dns_cf_token', '==', bws_secrets.CLOUDFLARE_API_TOKEN) | length == 0
      no_log: true

    - name: Add the GUI restart action
      oxlorg.opnsense.acme_action:
        name: restart-gui
        description: Restart the GUI
        type: configd_restart_gui

    - name: Add the HAProxy restart action
      oxlorg.opnsense.acme_action:
        name: restart-haproxy
        description: Restart HAProxy
        type: configd_restart_haproxy

    # The name the UI is reached by: the Cloudflare record for the tailnet address.
    - name: Add the UI certificate
      oxlorg.opnsense.acme_certificate:
        name: opnsense.sbbh.cloud
        description: opnsense.sbbh.cloud
        account: letsencrypt
        validation: cloudflare
        restart_actions:
          - restart-gui

    # The home ingress's wildcard, served by HAProxy below. A --check run before restart-haproxy
    # exists fails on the link (the module's error path crashes), ignored.
    - name: Add the ingress certificate
      oxlorg.opnsense.acme_certificate:
        name: "*.{{ ingress_domain }}"
        description: "*.{{ ingress_domain }}"
        account: letsencrypt
        validation: cloudflare
        restart_actions:
          - restart-haproxy
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Read the ACME certificates
      oxlorg.opnsense.raw:
        url: acmeclient/certificates/search
      register: _acme_certs
      check_mode: false

    # Creating a certificate doesn't issue it; renewal then runs from the plugin's cron job.
    - name: Issue the certificates
      oxlorg.opnsense.raw:
        url: "acmeclient/certificates/sign/{{ item.uuid }}"
        action: post
      loop: "{{ _acme_certs.response.rows | selectattr('description', 'in', _certs) | rejectattr('certRefId', 'truthy') }}"
      loop_control:
        label: "{{ item.description }}"

    # Signing runs in the background and the DNS-01 challenge takes a minute or two. HAProxy's
    # frontend needs the issued certificate's reference.
    - name: Wait for the certificates
      oxlorg.opnsense.raw:
        url: acmeclient/certificates/search
      register: _acme_certs
      until: >-
        ansible_check_mode or
        _acme_certs.response.rows | selectattr('description', 'in', _certs) | rejectattr('certRefId', 'truthy') | length == 0
      retries: 30
      delay: 10
      check_mode: false

    # The collection's modules only apply a change with reload: the VLANs and assignments reload
    # inline, since the next tasks need them; the rest notify a handler.
    - name: Create the VLANs on the trunk
      oxlorg.opnsense.interface_vlan:
        description: "{{ item.network }}"
        interface: "{{ item.parent }}"
        vlan: "{{ item.vlan }}"
        device: "{{ item.device }}"
        reload: true
      loop: "{{ _interfaces | selectattr('vlan', 'defined') }}"
      loop_control:
        label: "{{ item.network }}"

    - name: Assign the VLANs
      oxlorg.opnsense.interface_assignment:
        device: "{{ item.device }}"
        description: "{{ item.network | upper }}"
        reload: true
      loop: "{{ _interfaces | selectattr('vlan', 'defined') }}"
      loop_control:
        label: "{{ item.network }}"

    - name: Read the interface assignments
      oxlorg.opnsense.raw:
        url: interfaces/assignment/search_item
      register: _assignments

    # Device -> identifier (lan, opt1, ...). A VLAN that a first --check run hasn't created yet
    # has none, so the tasks below skip it.
    - name: Map devices to interface identifiers
      ansible.builtin.set_fact:
        _ids: "{{ _assignments.response.rows | items2dict(key_name='if', value_name='identifier') }}"

    - name: Read the internal interfaces
      oxlorg.opnsense.raw:
        url: "interfaces/assignment/get_item/{{ _ids[item.device] }}"
      loop: "{{ _interfaces | selectattr('device', 'in', _ids) }}"
      loop_control:
        label: "{{ item.network }}"
      register: _current

    # interface_assignment can't set addresses, so this goes through the assignment API.
    # IPv4 only: IPv6 off on every internal interface.
    - name: Set the internal interfaces to static IPv4, IPv6 off
      oxlorg.opnsense.raw:
        url: "interfaces/assignment/set_item/{{ _ids[item.item.device] }}"
        action: post
        data:
          interface: {enable: "1", type4: staticv4, ipaddr: "{{ item.item.addr }}", type6: ""}
      loop: "{{ _current.results }}"
      loop_control:
        label: "{{ item.item.network }}"
      vars:
        _i: "{{ item.response.interface }}"
        _type4: "{{ _i.type4 | dict2items | selectattr('value.selected', 'eq', 1) | map(attribute='key') | first }}"
        _type6: "{{ _i.type6 | dict2items | selectattr('value.selected', 'eq', 1) | map(attribute='key') | first }}"
      when: "[_i.enable, _type4, _i.ipaddr, _type6] != ['1', 'staticv4', item.item.addr, '']"
      register: _set
      # The API answers 200 with result 'failed' on a validation error; check mode posts nothing.
      changed_when: true
      failed_when: (_set.response.result | default('saved')) != 'saved'
      notify: Apply the interfaces

    # The bootstrap DHCP server from the runbook. It's off before Kea starts, since it holds
    # the DHCP port, and it also sends the IPv6 router advertisements.
    - name: Turn off dnsmasq
      oxlorg.opnsense.dnsmasq_general:
        enabled: false
        # The module resets unset fields, and the default 53 would collide with Unbound if it's
        # ever turned back on.
        port: 53053
      notify: Apply dnsmasq

    - name: Add a Kea subnet per Network with dhcp
      oxlorg.opnsense.dhcp_subnet:
        subnet: "{{ item.cidr }}"
        description: "{{ item.network }}"
        pools: ["{{ item.pool }}"]
        auto_options: false
        gateway: ["{{ item.ip }}"]
        dns: ["{{ item.ip }}"]
        # Left empty, Kea offers the firewall's own domain (internal), not the one home names live in.
        domain: "{{ home_domain }}"
      loop: "{{ _interfaces | selectattr('pool', 'defined') }}"
      loop_control:
        label: "{{ item.network }}"
      notify: Apply Kea

    - name: Read the Kea subnets
      oxlorg.opnsense.raw:
        url: kea/dhcpv4/search_subnet
      register: _subnets

    # A route to the prefix the tailnet advertises, so a Tailscale --accept-routes laptop at home
    # can prefer the LAN over the tunnel. Option 121, since dhcp_subnet's routes is the classful
    # option 33; it carries the default route too, as a client given 121 ignores option 3 (RFC 3442).
    - name: Hand clients a LAN route to the tailnet-advertised prefix
      oxlorg.opnsense.raw:
        url: "kea/dhcpv4/set_subnet/{{ _subnet.uuid }}"
        action: post
        data:
          subnet4: {option_data: {classless_static_route: "{{ _routes }}"}}
      vars:
        _clients: "{{ _interfaces | selectattr('network', 'eq', 'clients') | first }}"
        _subnet: "{{ _subnets.response.rows | selectattr('subnet', 'eq', _clients.cidr) | first }}"
        _routes: "{{ (tailnet_routes.opnsense.routes + ['0.0.0.0/0']) | map('regex_replace', '$', ' - ' ~ _clients.ip) | join(',') }}"
      when: _subnet['option_data.classless_static_route'] != _routes
      register: _set
      # The API answers 200 with result 'failed' on a validation error; check mode posts nothing.
      changed_when: true
      failed_when: (_set.response.result | default('saved')) != 'saved'
      notify: Apply Kea

    - name: Reserve every address with a mac
      oxlorg.opnsense.dhcp_reservation:
        ip: "{{ item.ip }}"
        mac: "{{ item.mac }}"
        subnet: "{{ item.subnet }}"
        hostname: "{{ item.hostname }}"
        description: "{{ item.hostname }}"
      loop: "{{ networks | dhcp_reservations }}"
      loop_control:
        label: "{{ item.hostname }}"
      notify: Apply Kea

    - name: Turn on Kea on the Networks with dhcp
      oxlorg.opnsense.dhcp_general:
        enabled: true
        interfaces: "{{ _interfaces | selectattr('pool', 'defined') | map(attribute='device') | select('in', _ids) | map('extract', _ids) }}"
      notify: Apply Kea

    - name: Add the host overrides
      oxlorg.opnsense.unbound_host:
        hostname: "{{ item.hostname }}"
        domain: "{{ item.domain }}"
        value: "{{ item.value }}"
        # Match on the name only, so a changed address updates the override instead of adding one.
        match_fields: [hostname, domain]
      loop: "{{ networks | dns_hosts(home_domain) + _dns_extra }}"
      loop_control:
        label: "{{ item.hostname }}.{{ item.domain }}"
      notify: Apply Unbound

    - name: Forward DNS over TLS to Quad9
      oxlorg.opnsense.unbound_dot:
        target: "{{ item }}"
        port: 853
        verify: dns.quad9.net
      loop: [9.9.9.9, 149.112.112.112]
      notify: Apply Unbound

    # Aliases match by name and rules by description. Nothing dropped from either list is
    # deleted, since the purge modules are unstable: see docs/runbooks/opnsense.md.
    - name: Add the aliases from network.yaml
      oxlorg.opnsense.alias:
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        content: "{{ item.content }}"
        description: "{{ item.description }}"
      loop: "{{ networks | firewall_aliases(pools) }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Apply the aliases

    - name: Add the port aliases
      oxlorg.opnsense.alias:
        name: "{{ item.key }}"
        type: port
        content: "{{ item.value }}"
      loop: "{{ port_aliases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      notify: Apply the aliases

    # tailscale0 was assigned by hand (docs/runbooks/opnsense.md), so it isn't in _interfaces.
    - name: Add the pass rules
      oxlorg.opnsense.rule:
        description: "{{ item.description }}"
        interface: "{{ item.interface }}"
        source_net: "{{ item.source_net }}"
        destination_net: "{{ item.destination_net }}"
        destination_invert: "{{ item.destination_invert }}"
        destination_port: "{{ item.destination_port }}"
        protocol: "{{ item.protocol }}"
        log: false
        match_fields: [description]
      loop: "{{ (rules + iot_allowances) | firewall_rules(_interfaces + [{'network': 'tailnet', 'device': 'tailscale0'}], _ids) }}"
      loop_control:
        label: "{{ item.description }}"
      notify: Apply the rules

    # The install's allow-all on LAN (mgmt), and a hand-made floating rule that opened UI and SSH
    # on every interface, WAN included. Kept here so a restored config.xml loses them again.
    - name: Remove the rules default deny replaces
      oxlorg.opnsense.rule:
        description: "{{ item }}"
        state: absent
        match_fields: [description]
      loop:
        - Default allow LAN to any rule
        - Default allow LAN IPv6 to any rule
        - "tailnet: UI and SSH"
      notify: Apply the rules

    # The home ingress: HAProxy routes https://<service>.<ingress_domain>, and each of its
    # `aliases`, through one map file to the Service's port on its Host. A server or backend dropped from the routes stays until
    # deleted by hand, but the map is rewritten, so its name stops routing at once. A --check run
    # skips this before the plugin is installed, and its links to objects it would create fail,
    # ignored.
    # shortcut: the published ports also answer plain HTTP to clients and the tailnet directly,
    # since their pass rules allow every Network. Every rule here has sequence 1, the floor, so a
    # block ahead of them means renumbering them all: do that when a Service must be reachable
    # only through the ingress (block clients and tailnet to the routed ports).
    - name: Configure the home ingress
      when: not (ansible_check_mode and _plugins is changed)
      block:
        - name: Add a server per route
          oxlorg.opnsense.haproxy_server:
            name: "{{ item.service }}"
            address: "{{ item.address }}"
            port: "{{ item.port }}"
          loop: "{{ _ingress_routes }}"
          loop_control:
            label: "{{ item.service }}"
          notify: Apply HAProxy

        - name: Add a backend per route
          oxlorg.opnsense.haproxy_backend:
            name: "{{ item.service }}"
            linked_servers: ["{{ item.service }}"]
          loop: "{{ _ingress_routes }}"
          loop_control:
            label: "{{ item.service }}"
          ignore_errors: "{{ ansible_check_mode }}"
          notify: Apply HAProxy

        - name: Map each name to its backend
          oxlorg.opnsense.haproxy_mapfile:
            name: ingress_routes
            # The API refuses a map file without one.
            description: Home ingress routes
            content: "{% for r in _ingress_routes %}{% for n in r.names %}{{ n }}.{{ ingress_domain }} {{ r.service }}\n{% endfor %}{% endfor %}"
          notify: Apply HAProxy

        - name: Route by the map
          oxlorg.opnsense.haproxy_action:
            name: ingress_routes
            description: Home ingress routes
            kind: map_use_backend
            map_use_backend_file: ingress_routes
          ignore_errors: "{{ ansible_check_mode }}"
          notify: Apply HAProxy

        # On the servers address only, so nothing listens on WAN. clients and the tailnet reach
        # it through their rules.
        - name: Add the frontend
          oxlorg.opnsense.haproxy_frontend:
            name: ingress
            description: Home ingress
            bind: ["{{ networks.servers.addresses.opnsense }}:443"]
            ssl_enabled: true
            ssl_certificates:
              - "{{ _acme_certs.response.rows | selectattr('description', '==', '*.' ~ ingress_domain) | map(attribute='certRefId') | first | default('') }}"
            linked_actions: [ingress_routes]
            forward_for: true
          ignore_errors: "{{ ansible_check_mode }}"
          notify: Apply HAProxy

        - name: Turn on HAProxy
          oxlorg.opnsense.haproxy_general_settings:
            enabled: true
          notify: Apply HAProxy

  # In this order: the interfaces get their addresses, and dnsmasq stops, before Kea starts.
  handlers:
    - name: Apply the interfaces
      oxlorg.opnsense.reload:
        target: interface_assignment

    - name: Apply dnsmasq
      oxlorg.opnsense.reload:
        target: dnsmasq

    - name: Apply Kea
      oxlorg.opnsense.reload:
        target: kea

    - name: Apply Unbound
      oxlorg.opnsense.reload:
        target: unbound

    # No rollback: OPNsense dropped the filter savepoint API. If an apply cuts the tailnet, LAN's
    # anti-lockout rule still lets a laptop on opnsense:1 into the UI.
    - name: Apply the aliases
      oxlorg.opnsense.reload:
        target: alias

    - name: Apply the rules
      oxlorg.opnsense.reload:
        target: rule

    # Last: the frontend binds the servers address, which the interfaces apply sets.
    - name: Apply HAProxy
      oxlorg.opnsense.reload:
        target: haproxy
