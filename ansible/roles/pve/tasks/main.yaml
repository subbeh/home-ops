---
# Creates pve_lxc (host_vars) with pct as root. Not through the API: it refuses bind mounts and
# most feature flags to non-root users, and community.proxmox needs a newer proxmoxer than
# Debian ships.
- name: Check whether {{ pve_lxc.hostname }} exists
  ansible.builtin.stat:
    path: /etc/pve/lxc/{{ pve_lxc.vmid }}.conf
  register: _ct

- name: Create {{ pve_lxc.hostname }}
  when: not _ct.stat.exists
  block:
    - name: Find the newest Debian template
      ansible.builtin.shell: |
        set -eo pipefail
        pveam update >/dev/null
        # The list mixes architectures, so match this Host.
        arch=$(dpkg --print-architecture)
        pveam available --section system | awk -v re="^debian-{{ ansible_facts.distribution_major_version }}-standard_.*_${arch}[.]" '$2 ~ re { t = $2 } END { print t }'
      args:
        executable: /bin/bash
      register: _template
      failed_when: _template.stdout == ''
      changed_when: false
      check_mode: false

    - name: Download the template
      ansible.builtin.command: pveam download local {{ _template.stdout }}
      args:
        creates: /var/lib/vz/template/cache/{{ _template.stdout }}

    # Only at creation: a later change here needs pct set by hand. The keys that reach this Host
    # reach the container too.
    - name: Create the container
      ansible.builtin.command: >-
        pct create {{ pve_lxc.vmid }} local:vztmpl/{{ _template.stdout }}
        --hostname {{ pve_lxc.hostname }}
        --ostype debian
        --unprivileged 1
        --cores {{ pve_lxc.cores }}
        --memory {{ pve_lxc.memory }}
        --rootfs {{ pve_lxc.disk }}
        --net0 name=eth0,bridge=vmbr0,ip={{ hostvars[pve_lxc.hostname].ansible_host }}/{{ networks.servers.cidr | split('/') | last }},gw={{ networks.servers.addresses[networks.servers.gateway] }}
        --ssh-public-keys /root/.ssh/authorized_keys
        --timezone host
        --onboot 1

- name: Create the bind-mounted data directory
  ansible.builtin.file:
    path: "{{ pve_lxc.options.mp0 | split(',') | first }}"
    state: directory
    owner: "100000"
    group: "100000"
    mode: "0755"

- name: Read {{ pve_lxc.hostname }}'s config
  ansible.builtin.command: pct config {{ pve_lxc.vmid }}
  register: _ct_config
  changed_when: false
  failed_when: false
  check_mode: false

# A change to a running container stays pending until it restarts.
- name: Set its options
  ansible.builtin.command: pct set {{ pve_lxc.vmid }} --{{ item.key }} {{ item.value | quote }}
  loop: "{{ pve_lxc.options | dict2items }}"
  when: "(item.key ~ ': ' ~ item.value) not in _ct_config.stdout_lines"

- name: Read {{ pve_lxc.hostname }}'s status
  ansible.builtin.command: pct status {{ pve_lxc.vmid }}
  register: _ct_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Start {{ pve_lxc.hostname }}
  ansible.builtin.command: pct start {{ pve_lxc.vmid }}
  when: "'running' not in _ct_status.stdout"

- name: Wait for SSH in {{ pve_lxc.hostname }}
  ansible.builtin.wait_for:
    host: "{{ hostvars[pve_lxc.hostname].ansible_host }}"
    port: 22
    timeout: 120
  when: not ansible_check_mode
