[defaults]
inventory            = inventory.yml
# For controllers without the mise env (Semaphore, CI); relative to this file.
roles_path           = roles
interpreter_python   = auto_silent
result_format        = yaml
host_key_checking    = false
deprecation_warnings = False

[inventory]
unparsed_is_failed = true

[privilege_escalation]
become = true

[connection]
pipelining = true

[diff]
always = true
