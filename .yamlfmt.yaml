---
# A copy of the nvim yamlfmt config (dotfiles: nvim/.config/yamlfmt/yamlfmt.yaml), so YAML formatted
# by the pre-commit hook or an agent matches YAML saved in the editor. Change both together.
formatter:
  type: basic
  retain_line_breaks_single: true
  include_document_start: true
  pad_line_comments: 2
  trim_trailing_whitespace: true
  scan_folded_as_literal: true
