# Vault values synced to Bitwarden Secrets Manager for home-ops, by
# infra/.matescripts/70-bws-sync.sh. Each key is the Secrets Manager key
# (UPPER_SNAKE, so it doubles as an env var name); each value is the arguments
# to the `bitwarden` template function: [item, type, field].
variables:
  bws:
    secrets:
      RESTIC_VPS_SSH_USER: [hetzner.com, field, storage-box-vps-user]
      RESTIC_VPS_SSH_KEY: [restic-ssh-key-vps, ssh, private]
      RESTIC_VPS_PASSWORD: [restic, login, password]
      GATUS_EXTERNAL_TOKEN: [gatus.int.sbbh.cloud, field, external-token]
      GATUS_PUSHOVER_APP_TOKEN: [pushover.net, field, api-token-gatus]
      GATUS_PUSHOVER_USER_KEY: [pushover.net, field, user-key]
      CLOUDFLARE_API_TOKEN: [cloudflare.com, field, sbbh-cloud-dns-api-token]
