[settings]
experimental = true

[settings.pipx]

[env]
MISE_DIR = 1
ANSIBLE_CONFIG            = "{{config_root}}/ansible/ansible.cfg"
ANSIBLE_HOME              = "{{config_root}}/ansible"
ANSIBLE_PLAYBOOK_DIR      = "{{config_root}}/ansible/playbooks"
ANSIBLE_COLLECTIONS_PATH  = "{{config_root}}/.cache/ansible/collections"
ANSIBLE_ROLES_PATH        = "{{config_root}}/.cache/ansible/roles:{{config_root}}/ansible/roles"
ANSIBLE_LOCAL_TEMP        = "{{config_root}}/.cache/ansible/tmp"
ANSIBLE_LOG_PATH          = "{{config_root}}/.cache/ansible/ansible.log"
ANSIBLE_GALAXY_TOKEN_PATH = "{{config_root}}/.cache/ansible/galaxy_token"
ANSIBLE_GALAXY_CACHE_DIR  = "{{config_root}}/.cache/ansible/galaxy_cache"
ANSIBLE_PERSISTENT_CONTROL_PATH_DIR = "{{config_root}}/.cache/ansible/pc"
KUBECONFIG                = "{{config_root}}/kubeconfig"
_.file                    = "{{config_root}}/.env"


[tools]
"pipx:ansible-core" = "2.21.5"
"pipx:pre-commit" = "4.7.0"
just = "1.59.0"
bitwarden-secrets-manager = "2.1.0"
terraform = "1.16.6"
