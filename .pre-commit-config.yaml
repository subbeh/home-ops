---
# Install with `just setup`. See docs/README.md for what these keep in sync.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # Rewrites the generated pages; on a diff the commit aborts so you can review and re-stage.
      - id: docs-generate
        name: Regenerate docs
        entry: bash -c 'just docs >/dev/null && git diff --exit-code --stat -- docs/'
        language: system
        pass_filenames: false
        files: ^(ansible/(inventory\.yml|group_vars/all/(devices|network)\.yaml|services/|playbooks/(docs\.yaml|templates/docs/|filter_plugins/))|terraform/|docs/services/[^/]+\.md$)
        stages: [pre-commit]

      # The PR check's syntax and Service load steps, caught before the push.
      - id: ansible-check
        name: Check Ansible
        entry: just check
        language: system
        pass_filenames: false
        files: ^ansible/
        stages: [pre-commit]

      # Formats as nvim does on save (.yamlfmt.yaml); on a change the commit aborts so you can re-stage.
      - id: yamlfmt
        name: Format YAML
        entry: yamlfmt
        language: system
        types: [yaml]
        stages: [pre-commit]

      - id: docs-covers
        name: Check covering docs are staged
        entry: scripts/docs-covers.sh
        language: script
        always_run: true
        stages: [commit-msg]
